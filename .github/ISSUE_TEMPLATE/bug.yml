name: Bug report
description: Something broken in Flex Forms
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
